<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Democracy Docket Cases</title>  

    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/crossfilter2@1.4.8/crossfilter.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/dc@4.2.7/dist/dc.js"></script>
   
    <script type="module" src="js/main.js"></script>
    
    <link href="https://cdn.jsdelivr.net/npm/dc@4.2.7/dist/style/dc.min.css" rel="stylesheet" type="text/css">
    
    <link href="css/layout.css" rel="stylesheet" type="text/css">
    <link href="css/style.css" rel="stylesheet" type="text/css">
</head>

<body>
    <div id="page-transition" class="page-transition"></div>
    <div id="app-container">
        <!-- Header Row -->
        <header id="app-header">
            <div id="title">
                <div class="title-main">
                    <h1>Democracy<br>Docket</h1>
                </div>
                <nav id="nav-links">
                    <a href="../app/index.html" class="active">Cases</a>
                    <a href="../static/index.html">Media Coverage</a>
                </nav>
            </div>
            <div id="updated-date"></div>
        </header>

        <div class="container">

        <div id="chart-map" class="map"></div> 
    
        <div id="section-filed" class="chart-section">
            <div class="chart-title">Cases Filed per Quarter</div>
            <div id="chart-qtr-filed"></div>
        </div>
        <div id="section-decided" class="chart-section">
            <div class="chart-title">Cases Decided per Quarter</div>
            <div id="chart-qtr-decided"></div>
        </div>

        <div id="chart-topic"><span class="chart-title">Topic</span></div>
        <div id="chart-caseStatus"><span class="chart-title">Case Status</span></div>
        
        <div id="results-zone">
            <div id="results-header">
                <div id="case-count"></div>
                <div id="filter-boxes"></div>
            </div>
            <div id="chart-list"></div>
        </div>
        </div>
    </div>
    <script>
        // Page transition handling
        const transition = document.getElementById('page-transition');
        
        // Fade in on page load
        transition.classList.add('fade-in');
        
        // Intercept nav link clicks for smooth transition
        document.querySelectorAll('#nav-links a:not(.active)').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const href = link.href;
                transition.classList.remove('fade-in');
                transition.classList.add('fade-out');
                setTimeout(() => { window.location.href = href; }, 150);
            });
        });
    </script>
</body>
